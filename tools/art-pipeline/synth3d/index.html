<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Synth3D Layer Bench</title>
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; background: #000; }
  canvas { display: block; }
</style>
</head>
<body>
<script type="importmap">
{
  "imports": {
    "three": "./vendor/three.module.min.js",
    "three/addons/loaders/GLTFLoader": "./vendor/addons/loaders/GLTFLoader.js",
    "three/addons/utils/BufferGeometryUtils": "./vendor/addons/utils/BufferGeometryUtils.js"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader';

// ---- constants -----------------------------------------------------------
const RENDER_W = 1200, RENDER_H = 675;
const WALKER_MAGENTA = 0xFF00FF;
const WALKER_HEAD_COLOR = 0xDDCCBB;
const GROUND_COLOR = 0x887766;
const SKY_COLOR = 0x5588CC;
const GROUND_SIZE = 30;

// ---- renderer, scene, camera ---------------------------------------------
const renderer = new THREE.WebGLRenderer({ antialias: false, preserveDrawingBuffer: true });
renderer.setSize(RENDER_W, RENDER_H);
renderer.setPixelRatio(1);
renderer.outputColorSpace = THREE.LinearSRGBColorSpace;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(SKY_COLOR);

const camera = new THREE.PerspectiveCamera(40, RENDER_W / RENDER_H, 0.1, 200);
camera.position.set(0, 14, 20);
camera.lookAt(0, 0, -2);
camera.updateProjectionMatrix();

// ---- lighting (normal mode) -----------------------------------------------
const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
scene.add(ambientLight);
const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
dirLight.position.set(5, 15, 10);
scene.add(dirLight);
const flickerLight = new THREE.PointLight(0xffaa44, 1.5, 12);
flickerLight.position.set(6, 2, 3);
scene.add(flickerLight);

// ---- scene object registry -----------------------------------------------
// Each entry: { mesh, pid, truth, baseWorldZ, baseWorldY, footprintBand }
// pid: unique part ID (1-based)
// truth: 'ground' | 'ysort' | 'overhead'
// baseWorldZ: world-space z of the object's ground contact (for y-sort)
// footprintBand: { x0, z0, x1, z1 } in world space where walker can't walk
const parts = [];
let nextPid = 1;

function registerPart(mesh, truth, baseWorldZ, footprintBand) {
  const pid = nextPid++;
  parts.push({ mesh, pid, truth, baseWorldZ, footprintBand: footprintBand || null });
  return pid;
}

// ---- ground plane ---------------------------------------------------------
const groundGeo = new THREE.PlaneGeometry(GROUND_SIZE, GROUND_SIZE, 32, 32);
groundGeo.rotateX(-Math.PI / 2);
// simple checkerboard via vertex colors
const pos = groundGeo.attributes.position;
const colors = new Float32Array(pos.count * 3);
for (let i = 0; i < pos.count; i++) {
  const x = pos.getX(i), z = pos.getZ(i);
  const checker = ((Math.floor(x + 15) + Math.floor(z + 15)) % 2 === 0) ? 0.42 : 0.38;
  colors[i * 3] = checker * 1.1;
  colors[i * 3 + 1] = checker;
  colors[i * 3 + 2] = checker * 0.85;
}
groundGeo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
const groundMat = new THREE.MeshLambertMaterial({ vertexColors: true });
const groundMesh = new THREE.Mesh(groundGeo, groundMat);
groundMesh.userData.isGround = true;
scene.add(groundMesh);

// ---- decals (GROUND truth) -----------------------------------------------
function makeDecal(x, z, w, d, color) {
  const geo = new THREE.PlaneGeometry(w, d);
  geo.rotateX(-Math.PI / 2);
  const mat = new THREE.MeshLambertMaterial({ color });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.set(x, 0.005, z);
  scene.add(mesh);
  registerPart(mesh, 'ground', z + d / 2, null);
  return mesh;
}

const decal1 = makeDecal(-2, 3, 3, 2.5, 0x994422);   // brown rug
const decal2 = makeDecal(9, -6, 2.5, 2, 0x336644);    // green tarp (isolated from standing objects)
const decal3 = makeDecal(-5, -3, 2, 1.5, 0x444488);   // blue mat

// ---- standing objects (YSORT truth) — procedural --------------------------
function makeBox(x, z, w, h, d, color) {
  const geo = new THREE.BoxGeometry(w, h, d);
  const mat = new THREE.MeshLambertMaterial({ color });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.set(x, h / 2, z);
  scene.add(mesh);
  const fp = { x0: x - w / 2, z0: z - d / 2, x1: x + w / 2, z1: z + d / 2 };
  registerPart(mesh, 'ysort', z + d / 2, fp);
  return mesh;
}

function makeCylinder(x, z, r, h, color) {
  const geo = new THREE.CylinderGeometry(r, r, h, 16);
  const mat = new THREE.MeshLambertMaterial({ color });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.set(x, h / 2, z);
  scene.add(mesh);
  const fp = { x0: x - r, z0: z - r, x1: x + r, z1: z + r };
  registerPart(mesh, 'ysort', z + r, fp);
  return mesh;
}

function makeTable(x, z) {
  const group = new THREE.Group();
  // tabletop
  const top = new THREE.Mesh(
    new THREE.BoxGeometry(1.6, 0.08, 1.0),
    new THREE.MeshLambertMaterial({ color: 0x996633 })
  );
  top.position.y = 0.9;
  group.add(top);
  // legs
  for (const [lx, lz] of [[-0.65, -0.4], [0.65, -0.4], [-0.65, 0.4], [0.65, 0.4]]) {
    const leg = new THREE.Mesh(
      new THREE.CylinderGeometry(0.04, 0.04, 0.9, 8),
      new THREE.MeshLambertMaterial({ color: 0x664422 })
    );
    leg.position.set(lx, 0.45, lz);
    group.add(leg);
  }
  group.position.set(x, 0, z);
  scene.add(group);
  const fp = { x0: x - 0.8, z0: z - 0.5, x1: x + 0.8, z1: z + 0.5 };
  registerPart(group, 'ysort', z + 0.5, fp);
  return group;
}

function makeKiosk(x, z) {
  const group = new THREE.Group();
  const base = new THREE.Mesh(
    new THREE.BoxGeometry(1.8, 1.4, 1.2),
    new THREE.MeshLambertMaterial({ color: 0x886644 })
  );
  base.position.y = 0.7;
  group.add(base);
  const roof = new THREE.Mesh(
    new THREE.BoxGeometry(2.2, 0.1, 1.6),
    new THREE.MeshLambertMaterial({ color: 0x553322 })
  );
  roof.position.y = 1.5;
  group.add(roof);
  group.position.set(x, 0, z);
  scene.add(group);
  const fp = { x0: x - 0.9, z0: z - 0.6, x1: x + 0.9, z1: z + 0.6 };
  registerPart(group, 'ysort', z + 0.6, fp);
  return group;
}

function makeBench(x, z) {
  const group = new THREE.Group();
  const seat = new THREE.Mesh(
    new THREE.BoxGeometry(2.0, 0.08, 0.5),
    new THREE.MeshLambertMaterial({ color: 0x885533 })
  );
  seat.position.y = 0.5;
  group.add(seat);
  for (const lx of [-0.85, 0.85]) {
    const leg = new THREE.Mesh(
      new THREE.BoxGeometry(0.08, 0.5, 0.5),
      new THREE.MeshLambertMaterial({ color: 0x554422 })
    );
    leg.position.set(lx, 0.25, 0);
    group.add(leg);
  }
  group.position.set(x, 0, z);
  scene.add(group);
  const fp = { x0: x - 1.0, z0: z - 0.25, x1: x + 1.0, z1: z + 0.25 };
  registerPart(group, 'ysort', z + 0.25, fp);
  return group;
}

function makeBookshelf(x, z) {
  const group = new THREE.Group();
  const frame = new THREE.Mesh(
    new THREE.BoxGeometry(1.2, 2.0, 0.4),
    new THREE.MeshLambertMaterial({ color: 0x664422 })
  );
  frame.position.y = 1.0;
  group.add(frame);
  for (let sy = 0.3; sy < 1.8; sy += 0.5) {
    const shelf = new THREE.Mesh(
      new THREE.BoxGeometry(1.1, 0.35, 0.35),
      new THREE.MeshLambertMaterial({ color: 0x338855 + Math.floor(sy * 40) * 256 })
    );
    shelf.position.set(0, sy, 0);
    group.add(shelf);
  }
  group.position.set(x, 0, z);
  scene.add(group);
  const fp = { x0: x - 0.6, z0: z - 0.2, x1: x + 0.6, z1: z + 0.2 };
  registerPart(group, 'ysort', z + 0.2, fp);
  return group;
}

// Place standing objects across the scene with varying depths.
// Objects are deliberately LARGE and DEEP (z-extent >= 1.5) so the walker
// can produce occlusion evidence when passing just behind them.
const crate1 = makeBox(-4, -4, 2.0, 1.8, 2.0, 0x997744);
const barrel1 = makeCylinder(-6, 1, 0.8, 1.8, 0x886644);
const table1 = makeTable(2, -3);
const kiosk1 = makeKiosk(-1, 0);
const bookshelf1 = makeBookshelf(5, -2);
const bench1 = makeBench(3, 4);
const crate2 = makeBox(6, 2, 1.6, 1.4, 1.6, 0xAA8855);
const barrel2 = makeCylinder(-3, 5, 0.7, 1.5, 0x775533);

// ---- tower / statue (Ivan's tower case: YSORT, collision at BASE only) ----
function makeTower(x, z) {
  const group = new THREE.Group();
  // wider base plinth: 1.4 x 0.5 x 1.4
  const plinth = new THREE.Mesh(
    new THREE.BoxGeometry(1.4, 0.5, 1.4),
    new THREE.MeshLambertMaterial({ color: 0x667788 })
  );
  plinth.position.y = 0.25;
  plinth.userData._towerBase = true;
  group.add(plinth);
  // narrow tall shaft: 0.5 x 3.5 x 0.5
  const shaft = new THREE.Mesh(
    new THREE.BoxGeometry(0.5, 3.5, 0.5),
    new THREE.MeshLambertMaterial({ color: 0x889999 })
  );
  shaft.position.y = 0.5 + 3.5 / 2;  // sits on top of plinth
  shaft.userData._towerShaft = true;
  group.add(shaft);
  // decorative cap
  const cap = new THREE.Mesh(
    new THREE.ConeGeometry(0.4, 0.6, 8),
    new THREE.MeshLambertMaterial({ color: 0x556677 })
  );
  cap.position.y = 0.5 + 3.5 + 0.3;
  group.add(cap);
  group.position.set(x, 0, z);
  scene.add(group);
  // footprint band = base plinth only
  const fp = { x0: x - 0.7, z0: z - 0.7, x1: x + 0.7, z1: z + 0.7 };
  const pid = registerPart(group, 'ysort', z + 0.7, fp);
  group.userData._towerPid = pid;
  return group;
}

const tower1 = makeTower(8, -4);

// ---- load CC0 GLB models as additional standing objects -------------------
const gltfLoader = new GLTFLoader();
const modelSlots = [
  { file: 'models/house.glb', x: -7, z: -2, scale: 0.9, truth: 'ysort' },
  { file: 'models/brick.glb', x: 0, z: 6, scale: 1.2, truth: 'ysort' },
];
const modelPromises = modelSlots.map(slot =>
  new Promise((resolve) => {
    gltfLoader.load(slot.file, (gltf) => {
      const model = gltf.scene;
      model.scale.setScalar(slot.scale);
      model.position.set(slot.x, 0, slot.z);
      scene.add(model);
      const box = new THREE.Box3().setFromObject(model);
      const sz = new THREE.Vector3();
      box.getSize(sz);
      const center = new THREE.Vector3();
      box.getCenter(center);
      const fp = {
        x0: center.x - sz.x / 2, z0: center.z - sz.z / 2,
        x1: center.x + sz.x / 2, z1: center.z + sz.z / 2
      };
      registerPart(model, slot.truth, center.z + sz.z / 2, fp);
      resolve();
    }, undefined, () => {
      console.warn('Failed to load', slot.file, '— using procedural fallback');
      const fallback = makeBox(slot.x, slot.z, 1.5, 1.5, 1.5, 0x998877);
      resolve();
    });
  })
);

// ---- overhead objects (OVERHEAD truth) ------------------------------------
// LARGER than production to ensure enough pixels for vote accumulation;
// the walker must pass under them with feet clearly past their base.
//
// ALWAYS-ON-TOP: the estimator expects a 2D compositor where OVERHEAD
// objects draw on top of the walker regardless of depth. Standard 3D
// depth testing would only produce occ_behind evidence (walker behind
// the overhead), which the estimator reads as YSORT. Setting depthTest
// off and high renderOrder simulates the compositor.
function setAlwaysOnTop(obj) {
  obj.renderOrder = 10;
  obj.traverse(child => {
    if (child.isMesh) {
      child.material.depthTest = false;
      child.material.depthWrite = false;
      child.renderOrder = 10;
    }
  });
}

function makeCable(points, radius) {
  const curve = new THREE.CatmullRomCurve3(points.map(p => new THREE.Vector3(...p)));
  const geo = new THREE.TubeGeometry(curve, 64, radius, 12, false);
  const mat = new THREE.MeshLambertMaterial({ color: 0x222222, depthTest: false, depthWrite: false });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.renderOrder = 10;
  scene.add(mesh);
  const maxZ = Math.max(...points.map(p => p[2]));
  registerPart(mesh, 'overhead', maxZ, null);
  return mesh;
}

function makeLantern(x, y, z, stringLen) {
  const group = new THREE.Group();
  const stringGeo = new THREE.CylinderGeometry(0.06, 0.06, stringLen, 6);
  const stringMat = new THREE.MeshLambertMaterial({ color: 0x333333 });
  const stringMesh = new THREE.Mesh(stringGeo, stringMat);
  stringMesh.position.y = stringLen / 2;
  group.add(stringMesh);
  const body = new THREE.Mesh(
    new THREE.BoxGeometry(2.0, 0.5, 0.3),
    new THREE.MeshLambertMaterial({ color: 0xFFCC44, emissive: 0x664400, emissiveIntensity: 0.5 })
  );
  group.add(body);
  const cap = new THREE.Mesh(
    new THREE.ConeGeometry(0.5, 0.25, 8),
    new THREE.MeshLambertMaterial({ color: 0x444444 })
  );
  cap.position.y = 0.45;
  group.add(cap);
  group.position.set(x, y - stringLen, z);
  scene.add(group);
  setAlwaysOnTop(group);
  registerPart(group, 'overhead', z, null);
  return group;
}

function makeSign(x, y, z, stringLen) {
  const group = new THREE.Group();
  const stringGeo = new THREE.CylinderGeometry(0.05, 0.05, stringLen, 6);
  const stringMat = new THREE.MeshLambertMaterial({ color: 0x333333 });
  const stringMesh = new THREE.Mesh(stringGeo, stringMat);
  stringMesh.position.y = stringLen / 2;
  group.add(stringMesh);
  const board = new THREE.Mesh(
    new THREE.BoxGeometry(2.5, 1.2, 0.08),
    new THREE.MeshLambertMaterial({ color: 0x884422 })
  );
  group.add(board);
  group.position.set(x, y - stringLen, z);
  scene.add(group);
  setAlwaysOnTop(group);
  registerPart(group, 'overhead', z, null);
  return group;
}

// Cable 1: thick catenary at z=-3, lowered so hanging objects overlap
// the walker's magenta body (body top at y≈1.6)
const cable1Points = [[-10, 3.5, -3], [-5, 2.8, -3], [0, 2.5, -3], [5, 2.8, -3], [10, 3.5, -3]];
const cable1 = makeCable(cable1Points, 0.15);

// Cable 2: at z=3, similarly lowered
const cable2Points = [[-10, 3.8, 3], [-4, 2.8, 3], [0, 2.5, 3], [4, 2.8, 3], [10, 3.8, 3]];
const cable2 = makeCable(cable2Points, 0.12);

// Lanterns hanging from cables — long strings put box body center at y≈0.8,
// a narrow band across the walker's magenta torso (body y 0.2–1.6).
// The box is 0.5 tall → covers y 0.55–1.05, leaving ≈0.35 units (13 px)
// of magenta below + 0.55 units (20 px) above = ~530 px visible (> 400).
const lantern1 = makeLantern(-2, 2.8, -3, 2.0);
const lantern2 = makeLantern(4, 2.8, -3, 2.0);
const lantern3 = makeLantern(-3, 2.8, 3, 2.0);

// Signs hanging from cables — board center at y≈1.3, well inside body range
const sign1 = makeSign(1, 2.6, -3, 1.2);
const sign2 = makeSign(5, 2.8, 3, 1.2);

// ---- smoke billboard (nuisance — must produce zero votes) -----------------
const smokeSprites = [];
for (let i = 0; i < 6; i++) {
  const smokeGeo = new THREE.PlaneGeometry(0.8, 0.8);
  const smokeMat = new THREE.MeshBasicMaterial({
    color: 0xBBBBCC, transparent: true, opacity: 0.0, side: THREE.DoubleSide,
    depthWrite: false
  });
  const smoke = new THREE.Mesh(smokeGeo, smokeMat);
  smoke.position.set(-5 + Math.random() * 2, 1.5 + i * 0.4, 3 + Math.random());
  smoke.lookAt(camera.position);
  scene.add(smoke);
  smokeSprites.push({ mesh: smoke, phase: Math.random() * Math.PI * 2, baseY: smoke.position.y });
}

// ---- walker ---------------------------------------------------------------
const walkerGroup = new THREE.Group();
// body — magenta emissive (unlit, so lighting can't shift it)
const bodyGeo = new THREE.CylinderGeometry(0.22, 0.22, 1.4, 12);
const bodyMat = new THREE.MeshBasicMaterial({ color: WALKER_MAGENTA });
const walkerBody = new THREE.Mesh(bodyGeo, bodyMat);
walkerBody.position.y = 0.9;
walkerGroup.add(walkerBody);
// head — non-magenta skin color
const headGeo = new THREE.SphereGeometry(0.18, 12, 8);
const headMat = new THREE.MeshBasicMaterial({ color: WALKER_HEAD_COLOR });
const walkerHead = new THREE.Mesh(headGeo, headMat);
walkerHead.position.y = 1.8;
walkerGroup.add(walkerHead);
walkerGroup.visible = false;
scene.add(walkerGroup);

// ---- rendering state ------------------------------------------------------
let renderMode = 'normal'; // 'normal' | 'parts' | 'ground' | 'collision'
const idMaterials = new Map(); // pid -> MeshBasicMaterial with unique color
const originalMaterials = new Map(); // object -> original material(s)

// pre-computed palette with guaranteed minimum RGB separation of ~60
// (30 entries from evenly-spaced HSV hues at full saturation, value 0.9)
const PALETTE = [
  [230, 46, 46], [230, 92, 46], [230,138, 46], [230,184, 46], [230,230, 46],
  [184,230, 46], [138,230, 46], [ 92,230, 46], [ 46,230, 46], [ 46,230, 92],
  [ 46,230,138], [ 46,230,184], [ 46,230,230], [ 46,184,230], [ 46,138,230],
  [ 46, 92,230], [ 46, 46,230], [ 92, 46,230], [138, 46,230], [184, 46,230],
  [230, 46,230], [230, 46,184], [230, 46,138], [230, 46, 92], [180, 80, 80],
  [ 80,180, 80], [ 80, 80,180], [180,180, 80], [ 80,180,180], [180, 80,180],
];
const PID_COLORS = {};
function pidToColor(pid) {
  if (!PID_COLORS[pid]) {
    const c = PALETTE[(pid - 1) % PALETTE.length];
    PID_COLORS[pid] = { r: c[0], g: c[1], b: c[2] };
  }
  const c = PID_COLORS[pid];
  return new THREE.Color(c.r / 255, c.g / 255, c.b / 255);
}

function setPartsMode() {
  renderMode = 'parts';
  renderer.setClearColor(0x000000);
  scene.background = new THREE.Color(0x000000);
  ambientLight.visible = false;
  dirLight.visible = false;
  flickerLight.visible = false;
  walkerGroup.visible = false;
  groundMesh.visible = false;
  for (const s of smokeSprites) s.mesh.visible = false;

  for (const p of parts) {
    const color = pidToColor(p.pid);
    const idMat = new THREE.MeshBasicMaterial({ color });
    idMaterials.set(p.pid, idMat);

    p.mesh.traverse(child => {
      if (child.isMesh) {
        if (!originalMaterials.has(child)) {
          originalMaterials.set(child, child.material);
        }
        child.material = idMat;
      }
    });
  }
}

function setGroundMode() {
  renderMode = 'ground';
  renderer.setClearColor(0x000000);
  scene.background = new THREE.Color(0x000000);
  ambientLight.visible = false;
  dirLight.visible = false;
  flickerLight.visible = false;
  walkerGroup.visible = false;
  for (const s of smokeSprites) s.mesh.visible = false;

  // ground plane = white (walkable floor)
  groundMesh.visible = true;
  groundMesh.material = new THREE.MeshBasicMaterial({ color: 0xffffff });

  // standing objects rendered BLACK to subtract their screen footprint
  // from the ground mask — those pixels are NOT walkable ground.
  // overhead + decals stay hidden (floor IS walkable under/at them).
  const blackMat = new THREE.MeshBasicMaterial({ color: 0x000000 });
  for (const p of parts) {
    if (p.truth === 'ysort') {
      p.mesh.visible = true;
      p.mesh.traverse(child => {
        if (child.isMesh) {
          if (!originalMaterials.has(child)) {
            originalMaterials.set(child, child.material);
          }
          child.material = blackMat;
        }
      });
    } else {
      p.mesh.visible = false;
    }
  }
}

function setCollisionMode() {
  renderMode = 'collision';
  renderer.setClearColor(0x000000);
  scene.background = new THREE.Color(0x000000);
  ambientLight.visible = false;
  dirLight.visible = false;
  flickerLight.visible = false;
  walkerGroup.visible = false;
  for (const s of smokeSprites) s.mesh.visible = false;

  // ground = white (walkable)
  groundMesh.visible = true;
  groundMesh.material = new THREE.MeshBasicMaterial({ color: 0xffffff });

  // standing objects rendered BLACK — their full screen footprint blocks
  // walking (matches the estimator's blocks threshold: >50% of non-ground
  // pixels must be collision-blocked).
  // EXCEPTION: tower parts — only the BASE PLINTH blocks walking, the tall
  // shaft is walkable-behind (Ivan's tower case: the whole tower is YSORT
  // for rendering but collision exists only at the base band)
  const blackMat = new THREE.MeshBasicMaterial({ color: 0x000000 });
  for (const p of parts) {
    if (p.truth === 'ysort') {
      p.mesh.visible = true;
      p.mesh.traverse(child => {
        if (child.isMesh) {
          if (!originalMaterials.has(child)) {
            originalMaterials.set(child, child.material);
          }
          if (child.userData._towerShaft) {
            // shaft is NOT collision — hide it so it doesn't render black
            child.visible = false;
          } else {
            child.material = blackMat;
          }
        }
      });
    } else {
      p.mesh.visible = false;
    }
  }
}

function setNormalMode() {
  renderMode = 'normal';
  renderer.setClearColor(SKY_COLOR);
  scene.background = new THREE.Color(SKY_COLOR);
  ambientLight.visible = true;
  dirLight.visible = true;
  flickerLight.visible = true;
  groundMesh.visible = true;
  groundMesh.material = groundMat;
  for (const s of smokeSprites) s.mesh.visible = true;

  // restore parts (including child visibility hidden by collision mode)
  for (const p of parts) {
    p.mesh.visible = true;
    p.mesh.traverse(child => {
      if (child.isMesh) {
        child.visible = true;
        if (originalMaterials.has(child)) {
          child.material = originalMaterials.get(child);
        }
      }
    });
  }

  // remove collision helpers
  const helpers = scene.children.filter(c => c.userData._collisionHelper);
  for (const h of helpers) scene.remove(h);

  idMaterials.clear();
}

// ---- animation state for smoke + flicker ----------------------------------
let frameCount = 0;

function animateNuisances() {
  frameCount++;
  // smoke billboards: drift upward, fade in/out
  for (const s of smokeSprites) {
    const t = frameCount * 0.05 + s.phase;
    s.mesh.position.y = s.baseY + Math.sin(t * 0.7) * 0.3;
    s.mesh.position.x += Math.sin(t * 0.3) * 0.005;
    s.mesh.material.opacity = Math.max(0, 0.15 + 0.1 * Math.sin(t));
    s.mesh.lookAt(camera.position);
  }
  // flicker light
  flickerLight.intensity = 1.5 + Math.sin(frameCount * 0.13) * 0.8;
}

// ---- public API (called from Playwright via page.evaluate) ----------------
window.synth3d = {
  setMode(mode) {
    if (mode === 'normal') setNormalMode();
    else if (mode === 'parts') setPartsMode();
    else if (mode === 'ground') setGroundMode();
    else if (mode === 'collision') setCollisionMode();
  },

  showWalker() { walkerGroup.visible = true; },
  hideWalker() { walkerGroup.visible = false; },

  setWalkerPos(x, z) {
    walkerGroup.position.set(x, 0, z);
    walkerGroup.visible = true;
  },

  render() {
    if (renderMode === 'normal') animateNuisances();
    renderer.render(scene, camera);
  },

  getPidColors() {
    // export the pid->RGB color mapping for Python-side decoding
    const out = {};
    for (const p of parts) {
      pidToColor(p.pid); // ensure PID_COLORS is populated
      out[p.pid] = PID_COLORS[p.pid];
    }
    return out;
  },

  getPartsInfo() {
    // project each part's 3D base to screen-space for truth metadata
    const result = {};
    for (const p of parts) {
      const worldPos = new THREE.Vector3();
      if (p.mesh.isGroup || p.mesh.isScene) {
        const box = new THREE.Box3().setFromObject(p.mesh);
        worldPos.copy(box.min);
        worldPos.y = 0;
        worldPos.x = (box.min.x + box.max.x) / 2;
        worldPos.z = box.max.z; // front-most z = base
      } else {
        p.mesh.getWorldPosition(worldPos);
        worldPos.y = 0;
      }
      const screenPos = worldPos.clone().project(camera);
      const screenY = (1 - screenPos.y) / 2 * RENDER_H;
      const screenX = (1 + screenPos.x) / 2 * RENDER_W;
      const info = {
        truth: p.truth,
        baseWorldZ: p.baseWorldZ,
        baseScreenY: Math.round(screenY),
        baseScreenX: Math.round(screenX),
        hasFootprint: !!p.footprintBand
      };
      // for ysort parts: compute the true collision band top in screen space
      // (footprint scoring — the estimator must discover this row)
      if (p.truth === 'ysort') {
        let bandTopWorldY;
        if (p.mesh.userData && p.mesh.userData._towerPid) {
          // tower: collision band = base plinth only (0.5 units tall)
          bandTopWorldY = 0.5;
        } else {
          // regular standing objects: full silhouette is collision
          const box = new THREE.Box3().setFromObject(p.mesh);
          bandTopWorldY = box.max.y;
        }
        const bandTopWorld = new THREE.Vector3(worldPos.x, bandTopWorldY, worldPos.z);
        const btProj = bandTopWorld.project(camera);
        info.trueBandTopScreenY = Math.round((1 - btProj.y) / 2 * RENDER_H);
      }
      result[p.pid] = info;
    }
    return result;
  },

  getWalkerScreenPos() {
    const feetWorld = walkerGroup.position.clone();
    const projected = feetWorld.project(camera);
    return {
      screenX: Math.round((1 + projected.x) / 2 * RENDER_W),
      screenY: Math.round((1 - projected.y) / 2 * RENDER_H)
    };
  },

  getCanvasDataURL() {
    renderer.render(scene, camera);
    return renderer.domElement.toDataURL('image/png');
  },

  getPartCount() { return parts.length; },

  getOverheadReachability() {
    const WALKER_H = 2.0, WALKER_R = 0.22, STEP = 0.4, RANGE = 12;
    const results = {};
    for (const p of parts) {
      if (p.truth !== 'overhead') continue;
      const pbox = new THREE.Box3().setFromObject(p.mesh);
      const corners = [];
      for (let xi = 0; xi <= 1; xi++)
        for (let yi = 0; yi <= 1; yi++)
          for (let zi = 0; zi <= 1; zi++) {
            const v = new THREE.Vector3(
              xi ? pbox.max.x : pbox.min.x,
              yi ? pbox.max.y : pbox.min.y,
              zi ? pbox.max.z : pbox.min.z
            ).project(camera);
            corners.push({
              sx: (1 + v.x) / 2 * RENDER_W,
              sy: (1 - v.y) / 2 * RENDER_H
            });
          }
      const ps = {
        x0: Math.min(...corners.map(c => c.sx)),
        y0: Math.min(...corners.map(c => c.sy)),
        x1: Math.max(...corners.map(c => c.sx)),
        y1: Math.max(...corners.map(c => c.sy))
      };
      let cnt = 0;
      const examples = [];
      for (let wx = -RANGE; wx <= RANGE; wx += STEP)
        for (let wz = -RANGE; wz <= RANGE; wz += STEP) {
          const feet = new THREE.Vector3(wx, 0, wz).project(camera);
          const head = new THREE.Vector3(wx, WALKER_H, wz).project(camera);
          const left = new THREE.Vector3(wx - WALKER_R, 0, wz).project(camera);
          const right = new THREE.Vector3(wx + WALKER_R, 0, wz).project(camera);
          const ws = {
            x0: Math.min((1+left.x)/2*RENDER_W, (1+right.x)/2*RENDER_W),
            y0: Math.min((1-feet.y)/2*RENDER_H, (1-head.y)/2*RENDER_H),
            x1: Math.max((1+left.x)/2*RENDER_W, (1+right.x)/2*RENDER_W),
            y1: Math.max((1-feet.y)/2*RENDER_H, (1-head.y)/2*RENDER_H)
          };
          if (ws.y1 < 0 || ws.y0 > RENDER_H || ws.x1 < 0 || ws.x0 > RENDER_W) continue;
          if (ws.x1 >= ps.x0 && ws.x0 <= ps.x1 && ws.y1 >= ps.y0 && ws.y0 <= ps.y1) {
            cnt++;
            if (examples.length < 5)
              examples.push({ worldX: wx, worldZ: wz,
                feetScreenY: Math.round((1-feet.y)/2*RENDER_H) });
          }
        }
      results[p.pid] = {
        reachable: cnt > 0, overlapCount: cnt, overlapExamples: examples,
        partScreenBox: { x0: Math.round(ps.x0), y0: Math.round(ps.y0),
                         x1: Math.round(ps.x1), y1: Math.round(ps.y1) }
      };
    }
    return results;
  },

  ready() { return true; }
};

// Wait for models to load, then signal ready
Promise.all(modelPromises).then(() => {
  window.synth3d._modelsLoaded = true;
  console.log(`Scene ready: ${parts.length} parts`);
  renderer.render(scene, camera);
});
</script>
