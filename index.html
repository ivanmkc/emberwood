<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Emberwood — the signal has gone dark</title>
<meta name="description" content="A tiny sci-fi exploration RPG. Recover the three Ember Cells and reignite the last beacon of the Ember Network.">
<meta name="theme-color" content="#0c0c12">
<meta property="og:title" content="Emberwood">
<meta property="og:description" content="The signal has gone dark. A tiny sci-fi exploration RPG in the browser.">
<meta property="og:image" content="https://ivanmkc.github.io/emberwood/docs/art-options/final-village-web.jpg">
<link rel="icon" href="assets/favicon.png" type="image/png">
<style>
  :root { color-scheme: dark; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%;
    background: radial-gradient(ellipse at 50% 30%, #131624 0%, #0a0b12 65%, #06070c 100%);
    color: #9a9aa2;
    font-family: monospace;
    overflow: hidden;
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    touch-action: none;
  }
  #stage {
    position: relative;
    width: min(100vw - 12px, calc((100vh - 44px) * 4 / 3));
    aspect-ratio: 4 / 3;
    border: 1px solid #262c42;
    border-radius: 4px;
    box-shadow: 0 0 34px rgba(80, 160, 170, 0.10), 0 8px 40px rgba(0, 0, 0, 0.6);
    overflow: hidden;
  }
  canvas {
    width: 100%;
    height: 100%;
    display: block;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    background: #0c0c12;
  }
  #bar {
    display: flex;
    gap: 14px;
    align-items: center;
    font-size: 11.5px;
    letter-spacing: 0.03em;
    color: #6b7286;
    background: rgba(14, 17, 28, 0.85);
    border: 1px solid #232940;
    border-radius: 4px;
    padding: 4px 12px;
  }
  #bar .accent { color: #4ac0c0; }
  #bar button {
    background: transparent;
    color: #ffb347;
    border: 1px solid rgba(255, 179, 71, 0.55);
    border-radius: 3px;
    font-family: monospace;
    font-size: 11.5px;
    padding: 3px 11px;
    cursor: pointer;
    transition: background 0.15s;
  }
  #bar button:hover { background: rgba(255, 179, 71, 0.12); }
  @media (max-width: 600px) {
    #bar .hint { display: none; }
  }
  /* touch controls */
  #touch { display: none; }
  @media (pointer: coarse) {
    #touch { display: block; }
  }
  .tbtn {
    position: absolute;
    width: 52px;
    height: 52px;
    border-radius: 10px;
    background: rgba(255, 255, 255, 0.10);
    border: 1px solid rgba(255, 255, 255, 0.25);
    color: rgba(255, 255, 255, 0.6);
    font-size: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    user-select: none;
    -webkit-user-select: none;
  }
  #t-up    { left: 64px;  bottom: 116px; }
  #t-down  { left: 64px;  bottom: 8px; }
  #t-left  { left: 8px;   bottom: 62px; }
  #t-right { left: 120px; bottom: 62px; }
  #t-a {
    right: 16px;
    bottom: 40px;
    width: 68px;
    height: 68px;
    border-radius: 50%;
    background: rgba(247, 201, 72, 0.18);
    border-color: rgba(247, 201, 72, 0.5);
    color: rgba(247, 201, 72, 0.8);
  }
  #t-j {
    right: 24px;
    bottom: 124px;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: rgba(74, 192, 192, 0.15);
    border-color: rgba(74, 192, 192, 0.45);
    color: rgba(74, 192, 192, 0.8);
    font-size: 15px;
  }
</style>
</head>
<body>
  <div id="stage">
    <canvas id="game" width="640" height="480"></canvas>
    <div id="touch">
      <div class="tbtn" id="t-up" data-dir="up">&#9650;</div>
      <div class="tbtn" id="t-down" data-dir="down">&#9660;</div>
      <div class="tbtn" id="t-left" data-dir="left">&#9664;</div>
      <div class="tbtn" id="t-right" data-dir="right">&#9654;</div>
      <div class="tbtn" id="t-a" data-action>A</div>
      <div class="tbtn" id="t-j" data-journal>J</div>
    </div>
  </div>
  <div id="bar">
    <span class="hint"><span class="accent">WASD</span> move &nbsp;<span class="accent">Space</span> interact &nbsp;<span class="accent">J</span> journal &nbsp;<span class="accent">M</span> music</span>
    <button id="new-game">New Game</button>
  </div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
